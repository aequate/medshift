[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medshift"
version = "1.0.0"
description = "Clinical LLM fine-tuning and evaluation under geographic, Arabic, code-switching, and sensor deployment shift."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["medshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
